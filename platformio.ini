; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-4848S040CIY1

[env:esp32-4848S040CIY1]
board = esp32-4848S040CIY1
platform = espressif32 @ 6.9.0
lib_deps = 
			https://github.com/greiman/SdFat
			https://github.com/JChristensen/movingAvg
			https://github.com/rzeldent/esp32-smartdisplay#develop
			https://github.com/lvgl/lvgl#release/v9.3
;			https://github.com/rzeldent/esp32-smartdisplay#release/2.1.0			
;			https://github.com/lvgl/lvgl#release/v9.2

[env:esp32-4848S040CIY1-pioarduino]
board = esp32-4848S040CIY1
platform =  https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;platform = https://github.com/pioarduino/platform-espressif32.git#develop
lib_deps = 
;			https://github.com/sailingfree/esp32-smartdisplay#develop
			https://github.com/rzeldent/esp32-smartdisplay#develop
			https://github.com/greiman/SdFat
			https://github.com/JChristensen/movingAvg
;			https://github.com/lvgl/lvgl#release/v9.3
			https://github.com/fbiego/ESP32Time

board_build.partitions = partitions_cyd.csv

[env]

framework = arduino
monitor_speed = 115200

upload_speed = 460800 

monitor_filters = esp32_exception_decoder

lib_extra_dirs = ../../../Arduino/libraries
				~/Arduino/libraries
				~\Arduino\libraries

lib_ignore = 	FreeRTOS 
				lv_arduino
				TFT_eSPI

extra_scripts =
	pre:build_script.py		
	pre:platformio_version_increment/version_increment_pre.py
   	post:platformio_version_increment/version_increment_post.py

build_type = release

build_flags = 
	;; This include path forces the compiler to use the local pins_arduino.h
	;; which has got the correct pins for the SPI for the sdcard
	-I${PROJECT_SRC_DIR}

	;; Optimise for space and speed
	-Os
	-Ofast
;	-DUSER_SETUP_LOADED=1

	;; Get lots of warnings
    -Wall

	;; But allow casts for c++ enums
	-Wno-strict-aliasing

;;	-DLV_USE_SCALE=1

    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    #'-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG'
    #'-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE'
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
	'-D TFT_WIDTH=DISPLAY_WIDTH'
    '-D TFT_HEIGHT=DISPLAY_HEIGHT'

	; Everything else is defined in the board json file

; suppress SdFat.h warning
	-DDISABLE_FS_H_WARNING=1

; For the custom font
	-DLV_LVGL_H_INCLUDE_SIMPLE=1
	
;upload_protocol = espota
;upload_port = esp32s3-C8929C
